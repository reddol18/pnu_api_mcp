name: build-lambda

# 웹(apps/web)을 Lambda Web Adapter용 zip으로 만든다. 배포는 하지 않는다(AWS 권한 없음).
# zip은 아티팩트로 남기고, 배포는 로컬에서 infra/deploy 스크립트로 한다(설계 §4-3, §7-8c).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/core/**"
      - "infra/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-lambda.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # pnpm 기본(.pnpm + 심볼릭 링크) 그대로면 standalone의 링크를 풀 때 next가 자기 의존 패키지(@swc/helpers 등)를
      # 못 찾는다. Lambda용 빌드만 평평한 node_modules로 설치해 standalone에 링크가 생기지 않게 한다.
      # (pnpm 10+는 명령줄 --config.node-linker가 먹지 않았다 → pnpm-workspace.yaml의 nodeLinker로, CI 안에서만)
      - name: pnpm 설치 (hoisted)
        run: |
          set -euo pipefail
          printf '\nnodeLinker: hoisted\n' >> pnpm-workspace.yaml
          pnpm install --frozen-lockfile
          # 정말 평평하게 깔렸는지: next와 @swc/helpers가 루트 node_modules에 실제 폴더로 있어야 한다
          test -d node_modules/next && test ! -L node_modules/next
          test -d node_modules/@swc/helpers
          test ! -d node_modules/.pnpm || echo "주의: .pnpm 폴더가 있다"
      - run: pnpm turbo run build --filter=@pnu/web...

      - name: Lambda 패키지 만들기
        run: |
          set -euo pipefail
          SA=apps/web/.next/standalone
          OUT=lambda
          rm -rf "$OUT" && mkdir -p "$OUT"
          # hoisted 설치라 링크는 (워크스페이스 패키지 정도만) 남는다. 남은 링크는 실제 파일로 풀어 복사한다
          cp -rL "$SA/." "$OUT/"
          if find "$OUT" -type l | grep -q .; then echo "링크가 남았다"; find "$OUT" -type l | head; exit 1; fi
          mkdir -p "$OUT/apps/web/.next"
          cp -r apps/web/.next/static "$OUT/apps/web/.next/static"
          if [ -d apps/web/public ]; then cp -r apps/web/public "$OUT/apps/web/public"; fi
          cp infra/run.sh "$OUT/run.sh"
          cp infra/access-log.cjs "$OUT/access-log.cjs"
          chmod +x "$OUT/run.sh"

      - name: 패키지 검사
        run: |
          set -euo pipefail
          OUT=lambda
          test -f "$OUT/apps/web/server.js"
          test -f "$OUT/packages/core/data/bjdong_codes.tsv"
          test -x "$OUT/run.sh"
          test -f "$OUT/access-log.cjs"
          du -sh "$OUT"

      - name: run.sh로 띄워서 확인 (Lambda와 같은 시작 방식, 키 없이)
        run: |
          set -euo pipefail
          # 키가 없어 공공 API는 실패하지만, 법정동코드 표만으로 지번 → PNU가 되고 응답은 와야 한다
          ./lambda/run.sh > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/ > /dev/null && break; sleep 1; done
          # grep -q가 먼저 끝나면 curl이 SIGPIPE로 실패해 pipefail에 걸린다 → 파일로 받아서 검사
          curl -sf http://127.0.0.1:8080/ -o home.html
          grep -q '필지-건물 관계 조회' home.html
          curl -sf "http://127.0.0.1:8080/api/analyze?q=$(node -e "process.stdout.write(encodeURIComponent('중랑구 상봉동 126-39'))")" | tee api.json | head -c 800; echo
          # 법정동코드 표로 PNU를 만들었으면 이 PNU가 나온다
          grep -q '"pnu":"1126010200101260039"' api.json
          # 정적 파일 하나가 실제로 나오는지
          CSS=$(grep -o '/_next/static/[^"]*\.css' home.html | head -1 || true)
          test -n "$CSS" && curl -sf -o /dev/null "http://127.0.0.1:8080$CSS"
          # 요청 로그(이슈 #7): 한 줄씩 남고, 쿼리 문자열(조회 주소)은 남지 않는다
          curl -s -o /dev/null -H 'CloudFront-Viewer-Address: 203.0.113.7:51234' "http://127.0.0.1:8080/no-such-page?secret=1"
          sleep 1
          grep -q '"log":"access","m":"GET","p":"/no-such-page","s":404' server.log
          grep -q '"ip":"203.0.113.7"' server.log
          if grep -q 'secret=1\|126-39' server.log; then echo "로그에 쿼리 문자열이 남았다"; exit 1; fi
          kill %1 || true

      - name: zip
        run: cd lambda && zip -qry ../pnu-web-lambda.zip . && ls -lh ../pnu-web-lambda.zip

      - uses: actions/upload-artifact@v7
        with:
          name: pnu-web-lambda
          path: pnu-web-lambda.zip
          retention-days: 7
          if-no-files-found: error

      - if: failure()
        run: |
          cat server.log api.json || true
          echo "--- standalone 진단"
          echo "[lambda/node_modules]"; ls lambda/node_modules 2>/dev/null | head -60 || true
          echo "[lambda/apps/web/node_modules]"; ls lambda/apps/web/node_modules 2>/dev/null || true
          echo "[@swc 위치: lambda]"; find lambda -type d -path '*@swc*' -maxdepth 5 2>/dev/null | head || true
          echo "[@swc 위치: 원본]"; find node_modules apps/web/node_modules -maxdepth 2 -type d -path '*@swc*' 2>/dev/null | head || true
          echo "[next 위치: 원본]"; ls -d node_modules/next apps/web/node_modules/next 2>/dev/null || true
          echo "[추적 목록에 swc]"; grep -o '[^"]*@swc/helpers[^"]*' apps/web/.next/next-server.js.nft.json 2>/dev/null | head -5 || true
          ls apps/web/.next/*.nft.json 2>/dev/null || true
