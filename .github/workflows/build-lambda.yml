name: build-lambda

# 웹(apps/web)을 Lambda Web Adapter용 zip으로 만든다. 배포는 하지 않는다(AWS 권한 없음).
# zip은 아티팩트로 남기고, 배포는 로컬에서 infra/deploy 스크립트로 한다(설계 §4-3, §7-8c).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/core/**"
      - "infra/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-lambda.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@pnu/web...

      - name: Lambda 패키지 만들기
        run: |
          set -euo pipefail
          SA=apps/web/.next/standalone
          OUT=lambda
          rm -rf "$OUT" && mkdir -p "$OUT"
          # pnpm 심볼릭 링크를 실제 파일로 풀어서 복사한다(Lambda zip에서 링크가 깨지지 않게)
          cp -rL "$SA/." "$OUT/"
          mkdir -p "$OUT/apps/web/.next"
          cp -r apps/web/.next/static "$OUT/apps/web/.next/static"
          if [ -d apps/web/public ]; then cp -r apps/web/public "$OUT/apps/web/public"; fi
          cp infra/run.sh "$OUT/run.sh"
          chmod +x "$OUT/run.sh"

      - name: 패키지 검사
        run: |
          set -euo pipefail
          OUT=lambda
          test -f "$OUT/apps/web/server.js"
          test -f "$OUT/packages/core/data/bjdong_codes.tsv"
          # core를 실행 환경에서 불러올 수 있는지 (standalone 추적에서 빠지면 여기서 실패)
          (cd "$OUT/apps/web" && node --input-type=module -e "const m = await import('@pnu/core'); if (typeof m.analyze !== 'function') throw new Error('core 없음'); console.log('core ok, 법정동', m.loadBjdongTable().size)")
          du -sh "$OUT"

      - name: 띄워서 확인 (키 없이 — 공공 API 호출은 실패해도 응답은 와야 한다)
        run: |
          set -euo pipefail
          cd lambda
          PORT=8080 HOSTNAME=127.0.0.1 NODE_ENV=production node apps/web/server.js > ../server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/ > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/ | grep -q '필지-건물 관계 조회'
          curl -sf "http://127.0.0.1:8080/api/analyze?q=1126010200101260039" | tee ../api.json | head -c 600; echo
          grep -q '"status":"ok"' ../api.json
          curl -sf -o /dev/null "http://127.0.0.1:8080/_next/static/" || true
          kill %1 || true

      - name: zip
        run: cd lambda && zip -qry ../pnu-web-lambda.zip . && ls -lh ../pnu-web-lambda.zip

      - uses: actions/upload-artifact@v7
        with:
          name: pnu-web-lambda
          path: pnu-web-lambda.zip
          retention-days: 7
          if-no-files-found: error

      - if: failure()
        run: cat server.log || true
