AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  pnu-web — 필지-건물 관계 조회 웹 (Next.js standalone on Lambda + Lambda Web Adapter, CloudFront).
  키는 SSM Parameter Store(/pnu-web/*)에서 배포 때 읽어 Lambda 환경변수로 넣는다. 설계 §4-3, §7-8c.

Parameters:
  CodeBucket:
    Type: String
    Description: Lambda zip이 있는 S3 버킷
  CodeKey:
    Type: String
    Description: Lambda zip의 S3 키
  CertificateArn:
    Type: String
    Description: us-east-1의 ACM 인증서 ARN (pnu.reddol18.pe.kr)
  DomainName:
    Type: String
    Default: pnu.reddol18.pe.kr
  VworldDomain:
    Type: String
    Default: https://pnu.reddol18.pe.kr
    Description: VWorld 키에 등록한 서비스 URL (공개 값)
  AdapterLayerVersion:
    Type: Number
    Default: 30
    Description: Lambda Web Adapter 레이어 버전 (2026-11-25 기준 최신 30 = 1.1.0, ap-northeast-2에서 조회로 확인)
  BudgetEmail:
    Type: String
    Description: 예산·차단 스위치 알림을 받을 이메일
  MemorySize:
    Type: Number
    Default: 512
    AllowedValues: [512, 1024]
    Description: >-
      Lambda 메모리(MB). 2026-11-25 측정(이슈 #4): 512MB에서 판정 268~708ms(1024MB 때 864~925ms),
      콜드 스타트 825ms(1024MB 806~968ms), 최대 156MB → 512로 낮춤
  ReservedConcurrency:
    Type: Number
    Default: 100
    MinValue: 1
    Description: >-
      예약 동시 실행 상한(이슈 #2). 정상 처리 0.87초면 약 115rps까지 받고, 넘는 요청은 Lambda가 바로 거절한다.
      최악의 시간당 Lambda 비용이 상한 × 3600 GB-초로 묶인다(1024MB, 100이면 약 $6).
  KillSwitchGbSeconds:
    Type: Number
    Default: 10000
    Description: >-
      5분 동안 Lambda 사용량(GB-초)이 이 값을 넘으면 차단 스위치가 동시 실행을 0으로 내린다(이슈 #5).
      1024MB면 평균 동시 실행 약 33을 5분 이어 간 양. 평소 30rps 급증(약 7,800)은 넘지 않는다.

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/pnu-web
      RetentionInDays: 7

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: cache-table
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem]
                Resource: !GetAtt CacheTable.Arn

  # 판정 결과 공유 캐시(이슈 #3). 키는 입력의 SHA-256, 값은 gzip JSON, 7일 TTL. 25GB까지 저장 무료
  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: pnu-web-cache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: k, AttributeType: S }
      KeySchema:
        - { AttributeName: k, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: pnu-web
      Description: pnu-web Next.js (Lambda Web Adapter)
      Runtime: nodejs22.x
      Architectures: [x86_64]
      Handler: run.sh
      MemorySize: !Ref MemorySize
      Timeout: 30
      # 차단 스위치가 0으로 내렸어도 다음 배포가 이 값으로 되돌린다(= 되살리는 방법 하나)
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Role: !GetAtt FunctionRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:${AdapterLayerVersion}
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_PORT: "8080"
          AWS_LWA_READINESS_CHECK_PATH: /
          JUSO_KEY: "{{resolve:ssm:/pnu-web/JUSO_KEY}}"
          DATA_GO_KR_KEY: "{{resolve:ssm:/pnu-web/DATA_GO_KR_KEY}}"
          VWORLD_KEY: "{{resolve:ssm:/pnu-web/VWORLD_KEY}}"
          VWORLD_DOMAIN: !Ref VworldDomain
          CACHE_TABLE: !Ref CacheTable

  # CloudFront만 부를 수 있게 IAM 인증(OAC 서명)으로 잠근다 → 직접 호출로 캐시·요청 제한을 우회하지 못한다
  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: AWS_IAM

  # 2025-10부터 함수 URL은 두 권한이 모두 필요하다 (CloudFront 개발자 가이드)
  AllowCloudFrontInvokeUrl:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      FunctionUrlAuthType: AWS_IAM
      SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  AllowCloudFrontInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: pnu-web-lambda
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── 안내 페이지(이슈 #5) ──────────────────────────────────────────────────
  # Lambda가 거절(429: 동시 실행 상한·차단 스위치)하거나 5xx면 CloudFront가 이 버킷으로 넘긴다(오리진 장애 조치).
  # 버킷에는 maintenance.html 하나뿐이라 요청 경로는 403이 되고, 사용자 지정 오류 응답이 403을 안내 페이지(503)로 바꾼다.
  # (사용자 지정 오류 응답은 429를 지원하지 않고, 오리진 장애 조치는 429를 지원한다 — CloudFront 개발자 가이드)
  MaintenanceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub pnu-web-maintenance-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  MaintenanceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MaintenanceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${MaintenanceBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  MaintenanceOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: pnu-web-maintenance
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # 배경지도 타일: Lambda를 거치지 않고 CloudFront가 브이월드에서 직접 받아 캐시한다(설계 §4-3 「배경지도」)
  TilesFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: pnu-web-tiles
      AutoPublish: true
      FunctionConfig:
        Comment: /tiles/{z}/{y}/{x}.png 검사(레벨 6~19, 한국 범위)와 주소 바꾸기
        Runtime: cloudfront-js-2.0
      # deploy.mjs가 apps/web/cloudfront/tiles.js 내용으로 바꿔 넣는다(코드 원본은 한 곳에만 둔다)
      FunctionCode: __TILES_FUNCTION_CODE__

  TilesCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: pnu-web-tiles-30d
        Comment: 배경지도 타일 30일 (브이월드는 max-age 3일을 주지만 배경지도는 자주 바뀌지 않는다)
        MinTTL: 2592000
        DefaultTTL: 2592000
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          HeadersConfig: { HeaderBehavior: none }
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: pnu-web
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Aliases: [!Ref DomainName]
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: lambda
            # https://xxxx.lambda-url.<region>.on.aws/ → 호스트만
            DomainName: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: vworld
            DomainName: api.vworld.kr
            # WMTS: /req/wmts/1.0.0/{key}/Base/{z}/{y}/{x}.png (명세). 키는 CloudFront 설정 안에만 있고 브라우저로 나가지 않는다
            OriginPath: "/req/wmts/1.0.0/{{resolve:ssm:/pnu-web/VWORLD_KEY}}/Base"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: maintenance
            DomainName: !GetAtt MaintenanceBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt MaintenanceOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        OriginGroups:
          Quantity: 1
          Items:
            - Id: lambda-or-maintenance
              FailoverCriteria:
                StatusCodes:
                  Quantity: 4
                  Items: [429, 502, 503, 504]
              Members:
                Quantity: 2
                Items:
                  - OriginId: lambda
                  - OriginId: maintenance
        CustomErrorResponses:
          # 안내 버킷에 없는 경로(403) → 안내 페이지, 상태 503. 앱 자체는 403을 내지 않는다
          - ErrorCode: 403
            ResponseCode: 503
            ResponsePagePath: /maintenance.html
            ErrorCachingMinTTL: 5
        DefaultCacheBehavior:
          TargetOriginId: lambda-or-maintenance
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # 페이지·API는 캐시하지 않는다(앱 안에서 결과 캐시). 헤더는 Host만 빼고 넘긴다(X-Forwarded-For → IP별 요청 제한)
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
        CacheBehaviors:
          # 빌드마다 이름이 바뀌는 정적 파일은 길게 캐시
          - PathPattern: /_next/static/*
            TargetOriginId: lambda
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          - PathPattern: /maintenance.html
            TargetOriginId: maintenance
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          - PathPattern: /tiles/*
            TargetOriginId: vworld
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: false
            CachePolicyId: !Ref TilesCachePolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt TilesFunction.FunctionARN

  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: pnu-web-monthly-1usd
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 1, Unit: USD }
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }

  # ── 비용 차단 스위치(이슈 #5) ─────────────────────────────────────────────
  # 요금 집계(예산)는 몇 시간 늦어 짧은 급증을 못 막는다 → 1분 단위로 반영되는 Lambda 지표로 본다.
  # 경보 → SNS → 차단용 Lambda가 웹 함수의 예약 동시 실행을 0으로(모든 요청 즉시 거절) + 메일.
  # CloudFront(페이지·타일) 요청은 이걸로 막히지 않는다.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: pnu-web-kill-switch
      Subscription:
        - { Protocol: email, Endpoint: !Ref BudgetEmail }

  KillSwitchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/pnu-web-kill-switch
      RetentionInDays: 30

  KillSwitchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: throttle-web-function
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:PutFunctionConcurrency
                Resource: !GetAtt Function.Arn

  KillSwitchFunction:
    Type: AWS::Lambda::Function
    DependsOn: KillSwitchLogGroup
    Properties:
      FunctionName: pnu-web-kill-switch
      Description: 사용량 경보가 울리면 pnu-web의 예약 동시 실행을 0으로 내린다
      Runtime: nodejs22.x
      Architectures: [x86_64]
      Handler: index.handler
      MemorySize: 128
      Timeout: 10
      Role: !GetAtt KillSwitchRole.Arn
      LoggingConfig:
        LogGroup: !Ref KillSwitchLogGroup
      Environment:
        Variables:
          TARGET_FUNCTION: !Ref Function
      Code:
        ZipFile: |
          const { LambdaClient, PutFunctionConcurrencyCommand } = require('@aws-sdk/client-lambda');
          const client = new LambdaClient({});
          exports.handler = async (event) => {
            for (const r of event.Records ?? []) {
              let msg = {};
              try { msg = JSON.parse(r.Sns?.Message ?? '{}'); } catch {}
              if (msg.NewStateValue !== 'ALARM') continue;
              await client.send(new PutFunctionConcurrencyCommand({
                FunctionName: process.env.TARGET_FUNCTION,
                ReservedConcurrentExecutions: 0,
              }));
              console.log(JSON.stringify({ killed: process.env.TARGET_FUNCTION, alarm: msg.AlarmName, reason: msg.NewStateReason }));
            }
          };

  KillSwitchSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: lambda
      Endpoint: !GetAtt KillSwitchFunction.Arn

  AllowSnsInvokeKillSwitch:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref KillSwitchFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref AlarmTopic

  UsageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: pnu-web-usage-kill-switch
      AlarmDescription: !Sub 5분 Lambda 사용량이 ${KillSwitchGbSeconds} GB-초를 넘음 → pnu-web 동시 실행 0 (되살리기는 CLAUDE.md 배포 절)
      Metrics:
        - Id: duration
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Duration
              Dimensions:
                - { Name: FunctionName, Value: !Ref Function }
            Period: 300
            Stat: Sum
        - Id: gbSeconds
          Label: GB-초 (5분)
          ReturnData: true
          Expression: !Sub duration / 1000 * ${MemorySize} / 1024
      ComparisonOperator: GreaterThanThreshold
      Threshold: !Ref KillSwitchGbSeconds
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  DistributionDomain:
    Description: 가비아에 pnu CNAME으로 넣을 값
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  FunctionName:
    Value: !Ref Function
  MaintenanceBucket:
    Description: deploy.mjs가 infra/maintenance.html을 올리는 버킷
    Value: !Ref MaintenanceBucket
